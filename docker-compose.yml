version: '3.5'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: shinchven/web2pdf
    container_name: web2pdf
    restart: always
    ports:
      - "3040:3030"
    environment:
      # Leave empty to allow requests without a token
      - API_TOKEN=${API_TOKEN:-}
    volumes:
      - ./output:/usr/src/app/public/output